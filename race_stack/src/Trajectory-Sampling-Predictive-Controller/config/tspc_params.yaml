tspc_node:
  ros__parameters:
    # 입력/맵 설정
    # true: 실제차 입력 /pf/viz/inferred_pose (PoseStamped, 속도는 위치 차분으로 추정)
    # false: 이 워크스페이스 시뮬레이터의 /car_state/odom (Odometry)
    real_environment: false
    # launch의 map_name 인자. 생략 시 launch 기본값을 사용합니다.
    map_name: "berlin"
    # launch가 map_name에 맞는 맵 디렉터리로 덮어씁니다. 보통 직접 설정하지 않습니다.
    map_dir: ""
    # global_waypoints.json에서 읽을 경로 키: IQP 또는 shortest path
    # 이 경로가 기본 주행 경로(레이스라인)이며, wpnts의 d_left/d_right를 트랙 경계로 사용합니다.
    trajectory_key: "global_traj_wpnts_iqp"

    # ===== 속도 =====
    # 경로 속도(vx_mps)가 유효하지 않을 때만 쓰는 대체 속도 [m/s].
    candidate_speed: 3.0
    # 경로 속도에 곱하는 배율: v_profile = waypoint.vx_mps * speed_scale
    speed_scale: 0.25
    # 경로 목표 속도의 상한/하한 [m/s]. 회피 속도도 이 범위로 제한됩니다.
    max_speed: 6.0
    min_speed: 1.0
    # 안전 점검용 후보 모델의 가속도 제한 [m/s^2]. 실제 속도 명령을 직접 제한하지는 않습니다.
    max_accel: 2.5

    # ===== 차량 =====
    # 시뮬레이터 sim_params.yaml 과 같은 값 (width 0.2032, length 0.58)
    veh_length: 0.58
    veh_width: 0.2032
    # 자전거 모델과 Pure Pursuit 계산의 축간거리 [m]
    wheelbase: 0.33
    # 조향각 제한 [rad]
    min_steer: -0.4189
    max_steer: 0.4189
    # 조향 명령 변화율 제한 [rad/s]. 시뮬레이터 sv_max(3.2) 이하로 둡니다.
    max_steer_rate: 3.0

    # ===== Pure Pursuit (흔들림에 가장 큰 영향) =====
    # lookahead = lookahead_distance + lookahead_speed_gain * v  (최대 lookahead_max)
    # 너무 작으면 좌우로 흔들리고, 너무 크면 코너 안쪽을 파고듭니다.
    lookahead_distance: 0.6
    lookahead_speed_gain: 0.25
    lookahead_max: 2.0
    # 회피 경로 추종 시 lookahead (좁은 시케인을 따라가야 하므로 더 짧게)
    avoid_lookahead_distance: 0.5
    avoid_lookahead_speed_gain: 0.15
    # Pure Pursuit 기준점을 pose 에서 뒤로 옮기는 거리 [m].
    # 0.17(뒤축)로 하면 무장애물 추종은 조금 더 매끄럽지만 회피 시 코너 안쪽을 파고들어 0 을 권장.
    pp_rear_axle_offset: 0.0
    # 조향 1차 저역통과 계수 (1.0 = 필터 없음, 작을수록 부드럽지만 반응이 늦음)
    steer_filter_alpha: 0.5

    # ===== LiDAR =====
    # LiDAR 점을 N개 중 1개만 사용 (클수록 계산이 가벼움)
    lidar_stride: 2
    # LiDAR 원점이 pose(차량 기준점)보다 앞에 있는 거리 [m].
    # 시뮬레이터는 0.27 m 고정. 실차는 base_link -> laser TF 의 x 값으로 맞추세요.
    # (이 값이 틀리면 커브에서 장애물이 옆으로 수십 cm 어긋나 보입니다)
    lidar_x_offset: 0.27
    # 장애물 확인에 쓰는 LiDAR 시야각 (전방 기준 전체 폭) [deg]. 옆으로 지나가는 장애물도 보도록 넓게.
    obstacle_fov_deg: 270.0

    # ===== 장애물 감지 / 메모리 =====
    # 레이스라인 앞쪽 몇 m까지 장애물을 보고 경로를 계획할지 [m] (DP 계획 구간 길이)
    obstacle_detect_distance: 4.0
    # 같은 격자 칸(10 cm)이 이 횟수 이상 스캔에 보여야 장애물로 인정 (노이즈 방지)
    obstacle_confirm_scans: 2
    # 장애물 점을 다시 보지 못해도 기억하는 시간 [s] (가려지거나 옆을 지날 때 유지)
    obstacle_memory_time: 1.5
    # LiDAR는 장애물 앞면만 보므로, 진행 방향으로 이만큼 더 이어져 있다고 가정 [m]
    obstacle_assumed_depth: 0.15
    # 맵 JSON에 d_left/d_right가 없을 때 쓰는 레이스라인 좌우 트랙 반폭 [m]
    track_half_width_default: 1.0
    # 트랙 경계(d_left/d_right)에서 이 거리 이내(또는 바깥)의 LiDAR 점은 벽으로 보고 제외 [m]
    track_wall_margin: 0.15
    # 정적 맵(<map>_orig.yaml 또는 <map>.yaml)의 벽에서 map_wall_margin 이내 점도 벽으로 제외.
    # 또한 DP 경로가 맵의 실제 벽에 너무 붙지 않게 경계로도 사용합니다.
    use_map_wall_filter: true
    map_wall_margin: 0.12

    # ===== DP 회피 경로 계획 =====
    # 장애물 여유: 차체 가장자리 ~ 장애물 점
    #   avoid_min_clearance 보다 가까운 경로는 금지(hard), avoid_clearance 까지는 비용으로 밀어냄(soft).
    #   스포너는 통로 0.41 m 이상을 보장 -> 차폭 0.2032 기준 한쪽 약 0.10 m 이므로 min 은 0.10 미만이어야 함.
    avoid_clearance: 0.20
    avoid_min_clearance: 0.06
    # 트랙 경계 여유: 차체 가장자리 ~ 트랙 경계 (soft / hard)
    track_boundary_margin: 0.20
    track_boundary_min_margin: 0.05
    # 장애물 앞뒤로 차체 반 길이에 더하는 여유 [m]
    avoid_longitudinal_margin: 0.05
    # DP 진행 방향 격자 간격 [m]
    plan_ds: 0.2
    # 진행 1 m 당 허용하는 최대 횡이동 [m/m]
    plan_max_lateral_slope: 0.6
    # 공칭 조건으로 경로가 없을 때(빠듯한 시케인) 완화 재시도:
    #   최소 여유 x plan_relax_clearance_factor, 최대 횡기울기 x plan_relax_slope_factor (이때는 avoid_tight_speed)
    plan_relax_clearance_factor: 0.5
    plan_relax_slope_factor: 1.6
    # 비용 가중치: 레이스라인에서 벗어남 / 횡이동 기울기 / 여유 부족 / 직전 계획과의 차이(좌우 선택 흔들림 방지)
    # plan_w_clearance 가 작으면 이동량이 적은 '좁은 쪽'을 고르다 벽에 닿을 수 있습니다.
    plan_w_offset: 1.0
    plan_w_slope: 2.0
    plan_w_clearance: 150.0
    plan_w_consistency: 3.0

    # ===== 회피 속도 / 복귀 =====
    # 회피/복귀 중 목표 속도 상한 [m/s] (레이스라인 속도보다 크게 올라가지 않음)
    avoid_speed: 1.5
    # 여유가 avoid_clearance 보다 좁은 통로를 지날 때 속도 상한 [m/s]
    avoid_tight_speed: 1.0
    # DP 계획 구간 끝에서 레이스라인까지 오프셋을 줄이는 거리 [m]
    rejoin_distance: 1.5
    # 회피 후 레이스라인 복귀 완료로 보는 횡방향 오차 [m]
    rejoin_done_tolerance: 0.10

    # ===== 후보 궤적 안전층 =====
    # Pure Pursuit 조향을 먼저 점검하고, 충돌하면 fan 후보 중 안전한 것을 사용합니다.
    # 후보 예측 단계 수 / 시간 간격 (예측 시간 = horizon * dt)
    horizon: 8
    dt: 0.1
    # fan 반각 [deg]: track = 레이스라인 추종, obstacle = 회피 중
    track_fan_half_angle_deg: 6.0
    obstacle_fan_half_angle_deg: 20.0
    # 후보 충돌 반경 = veh_width/2 + collision_margin.
    # DP 최소 여유(veh_width/2 + avoid_min_clearance)보다 작아야 회피 경로가 막히지 않습니다.
    collision_margin: 0.03
    # 롤아웃 최소 속도 [m/s]. 정지 상태에서 가까운 구간만 검사해 정지 데드락을 막습니다.
    safety_min_rollout_speed: 0.3
    # 시각화용 여유 거리 상한 [m]
    max_sight: 5.0
